<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    El icono de la pestaña: el badge de la marca con el glifo del Gestor
    dentro —el arco de horas alrededor de la aguja—, el mismo de
    `src/components/brand/GestorLogo.tsx`.

    Va sin animación y con el arco ya al 78%, que es donde se detiene: en 16
    píxeles el movimiento no se distingue y distrae en la barra de pestañas.
  -->
  <rect width="100" height="100" rx="26" fill="#0A1526"/>
  <rect x="0.75" y="0.75" width="98.5" height="98.5" rx="25.4" fill="none"
        stroke="#37D35B" stroke-opacity="0.85" stroke-width="1.5"/>

  <g transform="translate(23 23) scale(0.54)"
     fill="none" stroke="#37D35B" stroke-linecap="round">
    <!-- El carril: la jornada completa. -->
    <circle cx="50" cy="50" r="30" stroke-width="6.5" opacity="0.28"/>

    <!-- Las horas acumuladas: 78% de la vuelta, empezando arriba.
         188.5 es el perímetro (2·π·30); 41.5 es el 22% que queda sin
         dibujar. -->
    <circle cx="50" cy="50" r="30" stroke-width="6.5"
            stroke-dasharray="188.5" stroke-dashoffset="41.5"
            transform="rotate(-90 50 50)"/>

    <!-- La aguja, en el punto donde el arco se detiene. -->
    <g transform="rotate(281 50 50)">
      <line x1="50" y1="50" x2="50" y2="24" stroke-width="6"/>
      <circle cx="50" cy="24" r="3.5" fill="#37D35B" stroke="none"/>
    </g>

    <circle cx="50" cy="50" r="4" fill="#37D35B" stroke="none"/>
  </g>
</svg>
